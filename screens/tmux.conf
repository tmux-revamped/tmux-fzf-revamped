set -g default-terminal "tmux-256color"
set -g escape-time 1000
set -g status 2
set -g status-interval 1
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[default] "
set -g status-left-length 20
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W "
set -g @revamped_screen_keys ""
set -g status-format[1] "#[align=centre]#{?#{@revamped_screen_keys},#[fg=#1e1e2e#,bg=#f9e2af#,bold] #{@revamped_screen_keys} ,}"
set -g default-command "bash --noprofile --rcfile '$SCREENS_REPO/screens/setup.sh'"
bind -n C-] command-prompt -p "" "set -g @revamped_screen_keys '%%'"
set-environment -g HOME /Users/Shared/demo/home
set-environment -g TZ UTC
run-shell 'tmux set-environment -g PATH "/Users/Shared/demo/popup-bin:/Users/Shared/demo/bin:$PATH"'
set-environment -gu FZF_DEFAULT_OPTS
set-environment -gu FZF_DEFAULT_COMMAND
set -g @fzf_revamped_session_key S
set -g @fzf_revamped_window_key W
set -g @fzf_revamped_pane_key E
set -g @fzf_revamped_kill_key K
set -g @fzf_revamped_tree_key T
set -g @fzf_revamped_create_key C
set -g @fzf_revamped_url_key U
set -g @fzf_revamped_cheatsheet_key ?
set -g @fzf_revamped_process_key P
set -g @fzf_revamped_rename_key R
set -g @fzf_revamped_multikill_key X
set -g @fzf_revamped_broadcast_key B
set -g @fzf_revamped_zoxide_key Z
set -g @fzf_revamped_last_key L
set -g @fzf_revamped_move_key M
set -g @fzf_revamped_preview on
run-shell /Users/Shared/demo/tmux-fzf-revamped/fzf-revamped.tmux
